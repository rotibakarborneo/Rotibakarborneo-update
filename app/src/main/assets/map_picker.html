<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0}#hint{position:fixed;z-index:1000;top:12px;left:12px;right:12px;background:#173727;color:#fff;border-radius:14px;padding:12px;font:14px sans-serif;text-align:center}</style></head><body><div id="hint">Tekan titik lokasi outlet, lalu pilih Simpan lokasi.</div><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map').setView([-7.7956,110.3695],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);let marker;map.on('click',e=>{if(marker)map.removeLayer(marker);marker=L.marker(e.latlng).addTo(map).bindPopup(`<b>Lokasi outlet</b><br>${e.latlng.lat.toFixed(6)}, ${e.latlng.lng.toFixed(6)}<br><button onclick="OutletMap.pilih(${e.latlng.lat},${e.latlng.lng})">Simpan lokasi</button>`).openPopup()});</script></body></html>
