name: Build Flutter APK (Roti Bakar Borneo)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android scaffold, permissions, and notification desugaring
        working-directory: flutter_app
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name roti_bakar_borneo --org com.borneo.rotibakar .
          fi
          python3 - << 'EOF'
          import os, re

          # 1. AndroidManifest.xml permissions
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          perms = [
              "android.permission.INTERNET",
              "android.permission.CAMERA",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.VIBRATE",
          ]
          inject = ""
          for p in perms:
              if p not in content:
                  inject += f'    <uses-permission android:name="{p}" />\n'

          if inject:
              content = content.replace("<application", inject + "    <application", 1)

          content = re.sub(r'android:label="[^"]*"', 'android:label="Roti Bakar Borneo"', content)

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(content)

          # 2. Core library desugaring for flutter_local_notifications
          kts_path = "android/app/build.gradle.kts"
          groovy_path = "android/app/build.gradle"

          if os.path.exists(kts_path):
              with open(kts_path, "r", encoding="utf-8") as f:
                  g = f.read()
              if "isCoreLibraryDesugaringEnabled" not in g:
                  g = re.sub(
                      r'(compileOptions\s*\{)',
                      r'\1\n        isCoreLibraryDesugaringEnabled = true',
                      g,
                      count=1,
                  )
              if "desugar_jdk_libs" not in g:
                  g += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")\n}\n'
              with open(kts_path, "w", encoding="utf-8") as f:
                  f.write(g)
          elif os.path.exists(groovy_path):
              with open(groovy_path, "r", encoding="utf-8") as f:
                  g = f.read()
              if "coreLibraryDesugaringEnabled" not in g:
                  g = re.sub(
                      r'(compileOptions\s*\{)',
                      r'\1\n        coreLibraryDesugaringEnabled true',
                      g,
                      count=1,
                  )
              if "desugar_jdk_libs" not in g:
                  g += '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"\n}\n'
              with open(groovy_path, "w", encoding="utf-8") as f:
                  f.write(g)
          EOF

      - name: Install Flutter packages
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos

      - name: Build Release APK
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: roti-bakar-borneo-flutter-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
